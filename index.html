<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formular înscriere Afterschool</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f9f9f9;
      }
      header {
        background: #2d89ef;
        color: white;
        text-align: center;
        padding: 20px;
      }
      form {
        max-width: 600px;
        margin: 30px auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
      }
      input, textarea, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        margin-top: 20px;
        background: #2d89ef;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background: #1b5fa7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Formular de înscriere – Afterschool One-O-One</h1>
    </header>

    <form action="thankyou.html" method="get">
      <label for="nume">Nume copil:</label>
      <input type="text" id="nume" name="nume" required>

      <label for="varsta">Vârsta copilului:</label>
      <input type="number" id="varsta" name="varsta" required>

      <label for="parinte">Nume părinte:</label>
      <input type="text" id="parinte" name="parinte" required>

      <label for="telefon">Telefon:</label>
      <input type="tel" id="telefon" name="telefon" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      </select>

      <button type="submit">Trimite înscrierea</button>
    </form>
  </body>
</html>
